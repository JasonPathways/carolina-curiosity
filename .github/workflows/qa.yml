name: Carolina Curiosity QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install QA dependency
        run: npm install --no-save jsdom@24
      - name: Run integration QA
        run: node qa.cjs
